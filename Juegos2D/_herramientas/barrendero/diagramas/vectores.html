<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../comun/diagramas/estilo.css"></head><body><div id="captura">
<h1>Cómo empuja el motor: coseno y seno</h1>
<p class="sub">La nave apunta en un ángulo. El empuje se reparte entre la x (con <span class="mono">Math.cos</span>) y la y (con <span class="mono">Math.sin</span>).</p>
<svg width="940" height="420" viewBox="0 0 940 420">
 <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e63946"/></marker>
 <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e86de"/></marker>
 <marker id="c" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#27ae60"/></marker></defs>
 <rect width="940" height="420" fill="#0b1020" rx="10"/>
 <g transform="translate(150,300)">
  <line x1="-100" y1="0" x2="300" y2="0" stroke="#445" /><line x1="0" y1="80" x2="0" y2="-260" stroke="#445"/>
  <line x1="0" y1="0" x2="200" y2="-200" stroke="#e63946" stroke-width="5" marker-end="url(#a)"/>
  <line x1="0" y1="0" x2="200" y2="0" stroke="#2e86de" stroke-width="4" marker-end="url(#b)"/>
  <line x1="200" y1="0" x2="200" y2="-196" stroke="#27ae60" stroke-width="4" stroke-dasharray="8 5" marker-end="url(#c)"/>
  <path d="M 60 0 A 60 60 0 0 0 42 -42" fill="none" stroke="#ffd166" stroke-width="2"/>
  <text x="66" y="-18" fill="#ffd166" font-size="16">ángulo</text>
  <text x="60" y="-140" fill="#e63946" font-size="17" font-weight="bold">EMPUJE</text>
  <text x="70" y="26" fill="#6cb4ff" font-size="16">Math.cos(ángulo) × EMPUJE → vx</text>
  <text x="212" y="-100" fill="#57d68d" font-size="16">Math.sin(ángulo) × EMPUJE → vy</text>
  <g transform="translate(0,0) rotate(-45)"><path d="M18,0 L-12,-12 L-6,0 L-12,12 Z" fill="#e0fbfc" stroke="#3dccc7" stroke-width="2"/></g>
 </g>
 <g transform="translate(560,50)" fill="#e6edf3" font-size="15">
  <text y="0" font-weight="bold" font-size="17" fill="#80ffdb">En el código (cada fotograma):</text>
  <text y="34" font-family="DejaVu Sans Mono" font-size="13.5">nave.vx += Math.cos(nave.angulo) * EMPUJE * dt;</text>
  <text y="58" font-family="DejaVu Sans Mono" font-size="13.5">nave.vy += Math.sin(nave.angulo) * EMPUJE * dt;</text>
  <text y="100">• Apunta a la derecha (ángulo 0): cos = 1, sin = 0</text>
  <text y="124">   → todo el empuje va a la x.</text>
  <text y="156">• Apunta hacia arriba (ángulo -π/2): cos = 0, sin = -1</text>
  <text y="180">   → todo va a la y, hacia arriba (y negativa).</text>
  <text y="212">• En diagonal: se reparte entre las dos.</text>
  <text y="256" fill="#ffd166">Inercia: la velocidad se SUMA y se conserva.</text>
  <text y="280" fill="#ffd166">Si sueltas el motor, la nave sigue deslizándose</text>
  <text y="304" fill="#ffd166">y frena poco a poco por la FRICCION.</text>
 </g>
</svg></div></body></html>
