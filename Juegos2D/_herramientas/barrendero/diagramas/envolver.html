<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../comun/diagramas/estilo.css"></head><body><div id="captura">
<h1>El espacio "da la vuelta" (envolver)</h1>
<p class="sub">Lo que sale por un borde entra por el contrario, como si la pantalla fuera la superficie de un donut.</p>
<svg width="900" height="400" viewBox="0 0 900 400">
 <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker></defs>
 <rect x="150" y="40" width="600" height="320" fill="#0b1020" stroke="#3dccc7" stroke-width="3" rx="4"/>
 <g transform="translate(735,140)"><path d="M18,0 L-12,-12 L-6,0 L-12,12 Z" fill="#e0fbfc" stroke="#3dccc7" stroke-width="2"/></g>
 <line x1="770" y1="140" x2="840" y2="140" stroke="#ffd166" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#a)"/>
 <path d="M 850 140 C 890 140, 890 -10, 450 10 C 20 25, 40 140, 90 140" fill="none" stroke="#ffd166" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/>
 <g transform="translate(160,140)" opacity="0.9"><path d="M18,0 L-12,-12 L-6,0 L-12,12 Z" fill="#e0fbfc" stroke="#3dccc7" stroke-width="2"/></g>
 <text x="760" y="120" fill="#333" font-size="14">sale por la derecha…</text>
 <text x="70" y="180" fill="#333" font-size="14">…entra por la izquierda</text>
 <g transform="translate(450,300) rotate(90)"><path d="M18,0 L-12,-12 L-6,0 L-12,12 Z" fill="#e0fbfc" stroke="#3dccc7" stroke-width="2"/></g>
 <text x="470" y="345" fill="#ccd" font-size="14">igual arriba ↕ abajo</text>
 <text x="450" y="210" fill="#cfd8dc" font-size="15" text-anchor="middle" font-family="DejaVu Sans Mono">if (obj.x &gt; ANCHO + obj.radio) obj.x = -obj.radio;</text>
 <text x="450" y="236" fill="#cfd8dc" font-size="15" text-anchor="middle" font-family="DejaVu Sans Mono">if (obj.x &lt; -obj.radio) obj.x = ANCHO + obj.radio;</text>
</svg>
<p class="nota">Usamos <b>radio</b> en vez de 0 para que el objeto desaparezca <b>del todo</b> antes de saltar al otro lado; si no, se vería cómo "se teletransporta" a medio camino.</p>
</div></body></html>
